<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Akhir v9: Paparan Sempurna</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #preview-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            min-height: 500px;
            overflow: auto;
        }
        #preview-container {
            background-color: #e5e7eb;
            border: 2px dashed #9ca3af;
            position: relative;
            overflow: hidden;
            flex-shrink: 0; 
        }
        #blanko-preview {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
        }
        .generated-element {
            position: absolute;
            z-index: 10;
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 p-4 sm:p-8">

    <div class="max-w-7xl mx-auto">

        <div id="form-section">
            <h1 class="text-3xl font-bold mb-2">Penjana Templat Automatik</h1>
            <p class="mb-6 text-gray-500">Pilih opsyen utama. Sistem akan menjana templat profesional secara automatik menggunakan set data tetap.</p>

            <form id="template-form" class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="blanko-upload" class="block mb-2 text-sm font-medium">1. Muat Naik Blanko Sijil</label>
                        <input id="blanko-upload" type="file" accept="image/*" required class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400">
                    </div>
                    <div>
                        <label for="suitable_for" class="block mb-2 text-sm font-medium">2. Sesuai Untuk (Cth: Sijil Graduasi)</label>
                        <input type="text" id="suitable_for" value="Sijil Graduasi 2025" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    </div>
                    <div>
                        <label for="orientation" class="block mb-2 text-sm font-medium">3. Pilih Orientasi</label>
                        <select id="orientation" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                            <option value="Landscape" selected>Landscape</option>
                            <option value="Portrait">Portrait</option>
                        </select>
                    </div>
                    <div>
                        <label for="alignment" class="block mb-2 text-sm font-medium">4. Pilih Jajaran Lalai</label>
                        <select id="alignment" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                            <option value="Center" selected>Center</option>
                            <option value="Left">Left</option>
                            <option value="Right">Right</option>
                        </select>
                    </div>
                </div>
                <div class="mt-8 text-right">
                    <button type="submit" class="text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-green-600 dark:hover:bg-green-700">
                        Jana Templat
                    </button>
                </div>
            </form>
        </div>

        <div id="result-section" class="hidden">
            <h1 class="text-3xl font-bold mb-2">Templat Profesional Berjaya Dijana! ✅</h1>
            <p class="mb-6 text-gray-500">Berikut adalah pratonton visual dan data JSON yang akan disimpan.</p>

            <div class="bg-white dark:bg-gray-800 p-4 sm:p-8 rounded-lg shadow-md">
                <div>
                    <h3 class="font-bold text-xl mb-4 text-center">Pratonton Visual (Saiz Asli 100%)</h3>
                    <div id="preview-wrapper" class="bg-gray-200 dark:bg-gray-700 rounded-lg">
                        <div id="preview-container">
                            <img id="blanko-preview" src="" alt="Pratonton Blanko Sijil">
                            <div id="elements-container"></div>
                        </div>
                    </div>
                </div>

                <hr class="my-8 border-gray-300 dark:border-gray-600">

                <div>
                    <h3 class="font-bold text-xl mb-4">Data JSON untuk Disimpan</h3>
                    <div class="bg-gray-900 text-white p-4 rounded-lg shadow-inner">
                        <pre><code id="json-output" class="language-json text-sm"></code></pre>
                    </div>
                </div>
            </div>

             <div class="mt-8 text-center">
                <button id="reset-btn" type="button" class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700">
                    Cipta Templat Baru
                </button>
            </div>
        </div>
    </div>

document.addEventListener('DOMContentLoaded', () => {

        const choices = {
            suitableFor: document.getElementById('suitable_for').value,
            orientation: document.getElementById('orientation').value,
            alignment: document.getElementById('alignment').value,
        };

            alert('Sila muat naik imej blanko sijil.');
            return;
        }

            t.orientation === choices.orientation && t.alignment === choices.alignment
        );

            alert('Kombinasi reka letak tidak ditemui dalam data tetap.');
            return;
        }

            template_id: `(Akan dijana oleh MySQL, cth: ${matchedTemplate.id})`,
            template_url: matchedTemplate.imageUrl,
            suitable_for: choices.suitableFor,
            style: matchedTemplate.style,
            orientation: matchedTemplate.orientation,
            default_alignment: matchedTemplate.alignment,
            theme_color: matchedTemplate.theme_color,
            template_code: matchedTemplate.template_code,
            const_elements: matchedTemplate.content,
            created_by: 'nabil_backoffice_01',
            created_at: new Date().toISOString(),
            is_active: 1
        };

        const reader = new FileReader();
        reader.onload = (event) => {
            blankoPreview.src = event.target.result;
            jsonOutput.textContent = JSON.stringify(finalData, null, 4);
            previewContainer.style.width = `${matchedTemplate.original_width}px`;
            previewContainer.style.height = `${matchedTemplate.original_height}px`;
            previewContainer.style.transform = 'scale(1)'; 
            renderPreview(matchedTemplate.content, choices.alignment);
            formSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
        };
        reader.readAsDataURL(blankoUpload.files[0]);
    });

    resetBtn.addEventListener('click', () => {
        window.location.reload();
    });

    function renderPreview(elements, alignment) {
        elementsContainer.innerHTML = '';
        elements.forEach(el => {
            const div = document.createElement('div');
            div.classList.add('generated-element');
            div.style.left = `${el.position_x}px`;
            div.style.top = `${el.position_y}px`;
            div.style.fontFamily = `'${el.font_family}', sans-serif`;
            div.style.fontSize = `${el.font_size}px`;
            div.style.fontWeight = el.font_weight || 'normal';
            div.style.color = el.color;
            div.style.width = el.width ? `${el.width}px` : 'auto';
            div.style.height = el.height ? `${el.height}px` : 'auto';

            if (alignment === 'Center') {
                div.style.transform = 'translateX(-50%)';
            } else if (alignment === 'Right') {
                div.style.transform = 'translateX(-100%)';
            }

            if (el.type === 'text') {
                div.textContent = el.content;
                // `textAlign` hanya untuk teks
                if (alignment !== 'Left') {
                    div.style.textAlign = alignment.toLowerCase();
                }
            } else if (el.type === 'image' || el.type === 'qrcode') {
                // **PEMBETULAN: Memastikan bekas imej tidak dipengaruhi oleh sifat teks**
                div.style.display = 'flex';
                div.style.lineHeight = '1'; // Menghapuskan potensi ruang tambahan

                const img = document.createElement('img');
                img.alt = el.element_id;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                
                if (el.type === 'qrcode') {
                    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${el.width}x${el.height}&data=${encodeURIComponent(el.content)}`;
                    img.src = qrApiUrl;
                } else {
                    img.src = el.content;
                }
                
                img.onerror = function() {
                    this.onerror = null;
                    this.src = `https://via.placeholder.com/${el.width}x${el.height}/808080/FFFFFF?text=${el.element_id.replace('_',' ')}`; 
                };
                div.appendChild(img);
            }
            
            elementsContainer.appendChild(div);
        });
    }
});
</script>

</body>
